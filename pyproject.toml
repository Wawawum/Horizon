[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon"
version = "0.5.0"
requires-python = ">=3.11"
# Horizon est une application, pas une bibliotheque : les bornes hautes sont
# volontaires. Sans elles, une installation neuve resout la derniere version de
# chaque paquet et peut casser sans qu'aucun commit du depot n'ait change --
# c'est ce qui est arrive avec mcp 2.x. Les versions exactes du build gele sont
# dans requirements-build.txt.
dependencies = [
    # Qt 6 ; une majeure 7 changerait les APIs Qt utilisees partout dans widgets/
    "PySide6>=6.11,<7",
    # win32com.client et pythoncom (widgets/calendar.py, raccourcis globaux) ;
    # numerotation par build, API stable, pas de borne haute utile
    "pywin32>=306",
    # mcp 2.x a supprime l'API bas niveau de mcp_server.py (@server.list_tools())
    "mcp>=1.27,<2",
    # httpx est en 0.x : pas de garantie de stabilite entre mineures
    "httpx>=0.28,<1",
    # magasin de certificats de updater.py : celui de Windows, lu par l'OpenSSL de
    # Python, ne remonte pas toujours la chaine Sectigo servie par api.github.com ;
    # versionne par date, pas de borne haute utile
    "certifi>=2024.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/horizon"]

# hatch_build.py : telecharge draw.io (tools/fetch_drawio.py) et l'ajoute au wheel,
# .gitignore l'en excluant sinon
[tool.hatch.build.targets.wheel.hooks.custom]

[project.scripts]
horizon = "horizon.__main__:main"
horizon-mcp = "horizon.mcp_server:main"
